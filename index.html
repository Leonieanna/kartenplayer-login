<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kartenspieler – Spotify-Anmeldung</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 26rem; margin: 15vh auto 0; padding: 0 1.25rem; text-align: center; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  p { color: #888; }
  a.btn { display: inline-block; margin-top: 1rem; padding: .75rem 1.5rem; border-radius: 999px; background: #1db954; color: #000; font-weight: 600; text-decoration: none; }
  .err { color: #e5534b; }
</style>
</head>
<body>
<h1 id="title">Kartenspieler</h1>
<p id="msg">Einen Moment …</p>
<div id="action"></div>

<script>
// Spotify leitet nach dem Login hierher zurück (?code=...&state=...).
// "state" hat die Form  <zufall>.<adresse-des-players>  – die Seite schickt den
// Code an den Player im eigenen WLAN weiter. Es werden keine Daten gespeichert.
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), state = q.get("state") || "", error = q.get("error");
  var msg = document.getElementById("msg"), action = document.getElementById("action");

  function fail(text) {
    document.getElementById("title").textContent = "Anmeldung nicht geklappt";
    msg.className = "err";
    msg.textContent = text;
  }

  if (error) { fail(error === "access_denied" ? "Die Anmeldung wurde abgebrochen." : "Spotify meldet: " + error); return; }
  if (!code || state.indexOf(".") < 0) { msg.textContent = "Diese Seite wird nur bei der Spotify-Anmeldung des Kartenspielers gebraucht."; return; }

  var host = state.slice(state.indexOf(".") + 1);
  // Nur Adressen im eigenen Heimnetz erlauben (192.168.x.x, 10.x.x.x, 172.16–31.x.x, kartenspieler.local)
  var ok = /^karten(spieler|player)\.local$/.test(host) ||
           /^192\.168\.\d{1,3}\.\d{1,3}$/.test(host) ||
           /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(host) ||
           /^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$/.test(host);
  if (!ok) { fail("Unbekannte Player-Adresse."); return; }

  var target = "http://" + host + "/callback?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
  msg.textContent = "Angemeldet! Du wirst zum Kartenspieler weitergeleitet …";
  action.innerHTML = '<a class="btn" href="' + target + '">Weiter zum Kartenspieler</a>' +
    '<p style="font-size:.85rem">Klappt das nicht? Handy/Laptop muss im selben WLAN wie der Kartenspieler sein.</p>';
  setTimeout(function () { location.replace(target); }, 800);
})();
</script>
</body>
</html>
